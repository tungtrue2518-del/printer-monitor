<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printer Monitor</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5b6475; --line: #e3e6ec;
    --ok: #1f8a5b; --warn: #b7791f; --crit: #c53030; --bar: #e8ebf0; --accent: #2f6fde; --black: #2d3748;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e131d; --card: #161d2b; --text: #e8ecf4; --muted: #a7b1c4; --line: #263044;
            --ok: #48bb78; --warn: #ecc94b; --crit: #fc8181; --bar: #263044; --accent: #6ea0ff; --black: #cbd5e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 20px 24px 8px; }
  h1 { font-size: 22px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .summary { display: flex; gap: 24px; padding: 4px 24px 12px; color: var(--muted); }
  .summary b { color: var(--text); font-size: 20px; margin-right: 4px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 8px 24px 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; border-top: 4px solid var(--ok); }
  .card.warning { border-top-color: var(--warn); }
  .card.critical { border-top-color: var(--crit); }
  .name { font-weight: 600; font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; }
  .headline { margin: 10px 0; font-weight: 600; }
  .warning .headline { color: var(--warn); }
  .critical .headline { color: var(--crit); }
  .row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
  .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  li span { color: var(--muted); }
  .foot { margin-top: 10px; font-size: 12px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title">Printer Monitor</h1>
    <div class="meta" id="updated"></div>
  </div>
  <div class="controls">
    <button data-lang="en">EN</button><button data-lang="th">TH</button><button data-lang="ja">JA</button>
    <button id="refresh" data-t="refresh">Refresh</button>
  </div>
</header>
<div class="summary" id="summary"></div>
<main id="grid"></main>
<script>
const T = {
  en: { title: "Printer Monitor", refresh: "Refresh", updated: "Updated", online: "online", attention: "need attention",
        critical: "critical", pages: "pages", today: "today", month: "this month", empty: "empty by", offline: "offline",
        noSnmp: "SNMP not answering", open: "Open web panel", days: "days" },
  th: { title: "สถานะเครื่องพิมพ์", refresh: "รีเฟรช", updated: "อัปเดต", online: "ออนไลน์", attention: "ต้องดูแล",
        critical: "พิมพ์ไม่ได้", pages: "หน้า", today: "วันนี้", month: "เดือนนี้", empty: "หมดราว", offline: "ออฟไลน์",
        noSnmp: "SNMP ไม่ตอบ", open: "เปิดหน้าเว็บเครื่อง", days: "วัน" },
  ja: { title: "プリンター監視", refresh: "更新", updated: "更新", online: "オンライン", attention: "要対応",
        critical: "印刷不可", pages: "枚", today: "今日", month: "今月", empty: "切れる見込み", offline: "オフライン",
        noSnmp: "SNMP応答なし", open: "Webパネルを開く", days: "日" },
};
const COLORS = { black: "var(--black)", cyan: "#00a3c4", magenta: "#d53f8c", yellow: "#d69e2e" };
let lang = "en";
try { lang = localStorage.getItem("pm-lang") || (navigator.language || "en").slice(0, 2); } catch (e) {}
if (!T[lang]) lang = "en";
let status = null, usage = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => (n == null ? "-" : Number(n).toLocaleString());
const colorOf = (name) => { const n = name.toLowerCase(); for (const k in COLORS) if (n.includes(k)) return COLORS[k]; return null; };

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.title = t.title;
  if (!status) return;
  const s = status.summary;
  document.getElementById("updated").textContent = status.updatedAt ? `${t.updated} ${status.updatedAt.replace("T", " ")}` : "";
  document.getElementById("summary").innerHTML =
    `<span><b>${s.online}/${s.total}</b>${t.online}</span><span><b>${s.needingAttention}</b>${t.attention}</span><span><b>${s.critical}</b>${t.critical}</span>`;
  const use = {};
  (usage?.printers || []).forEach((u) => (use[u.ip] = u));
  document.getElementById("grid").innerHTML = status.printers.map((p) => {
    const u = use[p.ip] || {};
    const forecast = {};
    (u.toner || []).forEach((x) => (forecast[x.name] = x));
    const supplies = p.supplies.filter((x) => x.percent != null).map((x) => {
      const f = forecast[x.name];
      const hint = f && f.emptyBy ? ` title="${t.empty} ${f.emptyBy} (${f.daysLeft} ${t.days})"` : "";
      return `<div class="row"${hint}><span>${esc(x.name)}</span><div class="bar"><span style="width:${x.percent}%;${colorOf(x.name) ? `background:${colorOf(x.name)}` : ""}"></span></div><span class="num">${x.percent}%</span></div>`;
    }).join("");
    const problems = p.alerts.filter((a) => a.severity !== "info")
      .map((a) => `<li>${esc(a.title[lang])}${a.action[lang] ? ` <span>- ${esc(a.action[lang])}</span>` : ""}</li>`).join("");
    const sub = p.online ? (p.snmp ? esc(p.model) : t.noSnmp) : t.offline;
    return `<section class="card ${p.attention.level}">
      <div class="name">${esc(p.name)}</div>
      <div class="sub">${esc(p.ip)} - ${sub}</div>
      <div class="headline">${esc(p.attention.headline[lang])}</div>
      ${supplies}
      ${problems ? `<ul>${problems}</ul>` : ""}
      <div class="foot">${t.pages}: ${fmt(p.pageCount)} &middot; ${t.today} ${fmt(u.pagesToday)} &middot; ${t.month} ${fmt(u.pagesThisMonth)}
        &middot; <a href="http://${esc(p.ip)}/" target="_blank" rel="noopener">${t.open}</a></div>
    </section>`;
  }).join("");
}

async function load() {
  try {
    [status, usage] = await Promise.all([fetch("/api/status").then((r) => r.json()), fetch("/api/usage").then((r) => r.json())]);
  } catch (e) { /* keep the last good data on screen */ }
  render();
}

document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("pm-lang", lang); } catch (e) {}
  render();
}));
document.getElementById("refresh").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try { status = await fetch("/api/refresh", { method: "POST" }).then((r) => r.json()); } catch (err) {}
  e.target.disabled = false;
  render();
});
render();
load();
setInterval(load, 60000);
</script>
</body>
</html>
